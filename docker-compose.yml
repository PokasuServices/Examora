name: examora

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-examora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-examora_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-examora}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - examora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-examora}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-examora_local_password}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - examora_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-examora_local_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-examora_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-examora_local_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - examora_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-examora_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-examora_local_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-examora-uploads}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      echo 'MinIO bucket ready: '$$MINIO_BUCKET
      "

  # Malware scanning daemon (ADR-0005/ADR-0015, TD-005). First boot downloads
  # virus signatures (freshclam) and can take a few minutes; the automated
  # test suite does not depend on this service (see ADR-0015 — tests use
  # FakeMalwareScannerService). Optional for local dev unless you're
  # exercising the real ClamAvScannerService end-to-end.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - examora_clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "echo PING | timeout 5 nc -w 5 127.0.0.1 3310 | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  examora_postgres_data:
  examora_redis_data:
  examora_minio_data:
  examora_clamav_data:
